name: stage5-self-sufficiency-regression

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read

jobs:
  trigger:
    runs-on: ubuntu-24.04
    outputs:
      run_regression: ${{ steps.changed.outputs.run_regression }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 2
      - id: changed
        name: Check latest commit for checkpoint trigger
        shell: bash
        run: |
          if git diff --name-only HEAD^ HEAD | grep -qx 'stage5/selfhost/checkpoint-trigger.txt'; then
            echo 'run_regression=true' >> "$GITHUB_OUTPUT"
          else
            echo 'run_regression=false' >> "$GITHUB_OUTPUT"
          fi

  historical-regression:
    needs: trigger
    if: needs.trigger.outputs.run_regression == 'true'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26.x'

      - name: Materialize frozen packet for independent verifier
        run: python stage5/build_packet.py --output independent/python/packet
      - name: Verify Stage 5.12a foundation
        run: python stage5/selfhost/verify_foundation.py
      - name: Verify Stage 5.12b meta-sequence
        run: python stage5/selfhost/verify_meta_sequence.py
      - name: Verify Stage 5.12c integer codec
        run: python stage5/selfhost/verify_integer_codec.py
      - name: Preserve Stage 5.12d rejection
        run: python stage5/selfhost/verify_interleaved_pair_result.py
      - name: Preserve Stage 5.12e v0.1 rejection
        run: python stage5/selfhost/verify_functional_stream_v0_1_result.py
      - name: Reproduce accepted Stage 5.12e v0.2 development
        run: python stage5/selfhost/verify_functional_stream_v0_2.py
      - name: Validate Stage 5.12f contract and frozen result
        run: |
          python stage5/selfhost/validate_parser_contract.py
          python stage5/selfhost/verify_stream_parser_result.py

      - name: Preserve rejected full-codec v0.1 and v0.2 without re-executing them
        run: |
          python stage5/selfhost/validate_full_codec_contract.py
          python stage5/selfhost/build_full_codec.py --check
          python stage5/selfhost/validate_full_codec_contract_v0_2.py
          python stage5/selfhost/build_full_codec_v0_2.py --check
          python - <<'PY'
          import json
          from pathlib import Path
          root = Path('stage5/selfhost')
          expected = {
              'full-codec-development-result-v0.1.json': ('development_passed_candidate_frozen', None),
              'full-codec-exhaustive-result-v0.1.json': ('bounded_exhaustive_passed_candidate_frozen', None),
              'full-codec-holdout-result-v0.1.json': ('rejected_on_preregistered_holdout', 'rejected'),
              'full-codec-development-result-v0.2.json': ('rejected_on_frozen_development_resource_refusal', 'rejected'),
          }
          for name, (status, decision) in expected.items():
              data = json.loads((root / name).read_text())
              assert data['status'] == status, (name, data.get('status'))
              if decision is not None:
                  assert data['decision'] == decision, (name, data.get('decision'))
          print('full-codec v0.1/v0.2 immutable results: valid')
          PY

      - name: Validate frozen full-codec v0.3 identity
        run: |
          python stage5/selfhost/validate_full_codec_contract_v0_3.py
          python stage5/selfhost/build_full_codec_v0_3.py --check
          python stage5/selfhost/verify_full_codec_static_v0_3.py
      - name: Reproduce frozen full-codec v0.3 development
        run: python stage5/selfhost/verify_full_codec_development_v0_3.py
      - name: Reproduce frozen full-codec v0.3 bounded exhaustive class
        run: python stage5/selfhost/verify_full_codec_exhaustive_v0_3.py
      - name: Verify accepted v0.3 one-shot holdout result without rerunning holdout
        run: python stage5/selfhost/verify_full_codec_result_v0_3.py

      - name: Verify independent Python implementation
        working-directory: independent/python
        run: python verify.py
      - name: Verify Go reference and frozen Stage 4 evidence
        working-directory: reference/go
        run: sh verify.sh
