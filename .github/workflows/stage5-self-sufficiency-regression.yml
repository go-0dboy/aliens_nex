name: stage5-self-sufficiency-regression

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read

jobs:
  trigger:
    runs-on: ubuntu-24.04
    outputs:
      run_regression: ${{ steps.changed.outputs.run_regression }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 2
      - id: changed
        name: Check latest commit for checkpoint trigger
        shell: bash
        run: |
          if git diff --name-only HEAD^ HEAD | grep -qx 'stage5/selfhost/checkpoint-trigger.txt'; then
            echo 'run_regression=true' >> "$GITHUB_OUTPUT"
          else
            echo 'run_regression=false' >> "$GITHUB_OUTPUT"
          fi

  historical-regression:
    needs: trigger
    if: needs.trigger.outputs.run_regression == 'true'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-go@v5
        with:
          go-version: '1.23.x'

      - name: Materialize frozen packet for independent verifier
        run: python stage5/build_packet.py --output independent/python/packet

      - name: Verify Stage 5.12a foundation across Python and Go
        run: python stage5/selfhost/verify_foundation.py

      - name: Measure Stage 5.12b meta-sequence across CBN and call-by-need
        run: python stage5/selfhost/verify_meta_sequence.py --report /tmp/meta-sequence-measurements.json

      - name: Upload Stage 5.12b measurement artifact
        uses: actions/upload-artifact@v4
        with:
          name: stage5-selfhost-meta-sequence-measurements
          path: /tmp/meta-sequence-measurements.json
          if-no-files-found: error

      - name: Verify Stage 5.12c NEX integer codec
        run: python stage5/selfhost/verify_integer_codec.py

      - name: Reproduce Stage 5.12d interleaved-pair rejection
        run: python stage5/selfhost/verify_interleaved_pair_result.py

      - name: Reproduce Stage 5.12e functional-stream v0.1 rejection
        run: python stage5/selfhost/verify_functional_stream_v0_1_result.py

      - name: Reproduce accepted Stage 5.12e functional-stream v0.2 development result
        run: python stage5/selfhost/verify_functional_stream_v0_2.py

      - name: Validate Stage 5.12f parser contract/workloads
        run: python stage5/selfhost/validate_parser_contract.py

      - name: Reproduce Stage 5.12f parser v0.1 development result
        run: python stage5/selfhost/verify_stream_parser.py

      - name: Validate frozen Stage 5.12f holdout result without re-executing holdout
        run: python stage5/selfhost/verify_stream_parser_result.py

      - name: Verify independent Python implementation
        working-directory: independent/python
        run: python verify.py

      - name: Verify Go reference and frozen Stage 4 evidence
        working-directory: reference/go
        run: sh verify.sh
