name: stage5-full-codec-exhaustive

on:
  pull_request:
    paths:
      - 'stage5/selfhost/build_full_codec.py'
      - 'stage5/selfhost/full-codec-v0.1.json'
      - 'stage5/selfhost/full-codec-contract-v0.1.json'
      - 'stage5/selfhost/verify_full_codec_static.py'
      - 'stage5/selfhost/verify_full_codec_exhaustive.py'
      - 'reference/go/cmd/nextermcontrol/**'
      - '.github/workflows/stage5-full-codec-exhaustive.yml'

permissions:
  contents: read

jobs:
  exhaustive:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26.x'
      - name: Verify frozen full codec candidate statically
        run: python stage5/selfhost/verify_full_codec_static.py
      - name: Execute frozen complete 27-Term class
        run: python stage5/selfhost/verify_full_codec_exhaustive.py
