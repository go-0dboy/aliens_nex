name: stage5-bootstrap-feasibility

on:
  pull_request:
    paths:
      - 'stage5/bootstrap/**'
      - 'stage5/independent-checkpoints/python-v0.1.json'
      - 'stage5/receiver-assumptions/**'
      - 'docs/experiments/stage5-bootstrap-feasibility.md'
      - 'docs/STAGE-5.md'
      - 'docs/STATUS.md'
      - 'docs/RESEARCH-DISSERTATION.md'
      - 'docs/RESEARCH-DISSERTATION.ru.md'
  push:
    branches: [ main ]
    paths:
      - 'stage5/bootstrap/**'
      - 'stage5/independent-checkpoints/python-v0.1.json'
      - 'stage5/receiver-assumptions/**'
      - 'docs/experiments/stage5-bootstrap-feasibility.md'
      - 'docs/STAGE-5.md'
      - 'docs/STATUS.md'
      - 'docs/RESEARCH-DISSERTATION.md'
      - 'docs/RESEARCH-DISSERTATION.ru.md'

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate bootstrap feasibility audit
        run: python stage5/bootstrap/validate_attempt.py
