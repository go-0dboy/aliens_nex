name: stage5-dissertation-sync

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: write

jobs:
  trigger:
    runs-on: ubuntu-24.04
    outputs:
      run_sync: ${{ steps.changed.outputs.run_sync }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 2
      - id: changed
        shell: bash
        run: |
          if git diff --name-only HEAD^ HEAD | grep -qx 'stage5/selfhost/dissertation-sync-trigger.txt'; then
            echo 'run_sync=true' >> "$GITHUB_OUTPUT"
          else
            echo 'run_sync=false' >> "$GITHUB_OUTPUT"
          fi

  sync:
    needs: trigger
    if: needs.trigger.outputs.run_sync == 'true'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Apply guarded dissertation patch
        run: python stage5/selfhost/sync_stage5_12_dissertations.py
      - name: Verify only dissertation files changed
        shell: bash
        run: |
          changed="$(git diff --name-only)"
          test "$changed" = $'docs/RESEARCH-DISSERTATION.md\ndocs/RESEARCH-DISSERTATION.ru.md'
      - name: Commit synchronized dissertations
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add docs/RESEARCH-DISSERTATION.md docs/RESEARCH-DISSERTATION.ru.md
          git commit -m 'Stage 5.12: synchronize living dissertations'
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
