name: docs-stage5-12-reconcile

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: write

jobs:
  trigger:
    runs-on: ubuntu-24.04
    outputs:
      run_reconcile: ${{ steps.changed.outputs.run_reconcile }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 2
      - id: changed
        name: Check latest commit for documentation reconciliation trigger
        shell: bash
        run: |
          if git diff --name-only HEAD^ HEAD | grep -qx 'stage5/selfhost/docs-reconcile-trigger.txt'; then
            echo 'run_reconcile=true' >> "$GITHUB_OUTPUT"
          else
            echo 'run_reconcile=false' >> "$GITHUB_OUTPUT"
          fi

  reconcile:
    needs: trigger
    if: needs.trigger.outputs.run_reconcile == 'true'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Reconcile and audit Stage 5.12 documentation
        run: python stage5/selfhost/reconcile_stage5_12_docs.py
      - name: Verify only documentation changed
        shell: bash
        run: |
          changed="$(git diff --name-only)"
          test -n "$changed"
          printf '%s\n' "$changed"
          if printf '%s\n' "$changed" | grep -Ev '^(README(\.ru)?\.md|docs/.*\.md)$'; then
            echo 'Unexpected non-documentation change' >&2
            exit 1
          fi
      - name: Commit reconciled documentation
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add README.md README.ru.md docs
          git commit -m 'Docs: reconcile Stage 5.12 completion state'
          git push origin HEAD:${{ github.head_ref }}
