name: stage5-self-sufficiency-holdout

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read

jobs:
  trigger:
    runs-on: ubuntu-24.04
    outputs:
      run_functional_stream_holdout: ${{ steps.changed.outputs.run_functional_stream_holdout }}
      run_parser_holdout: ${{ steps.changed.outputs.run_parser_holdout }}
      run_full_codec_holdout: ${{ steps.changed.outputs.run_full_codec_holdout }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 2
      - id: changed
        name: Check latest commit for holdout trigger
        shell: bash
        run: |
          changed="$(git diff --name-only HEAD^ HEAD)"
          if printf '%s\n' "$changed" | grep -qx 'stage5/selfhost/holdout-trigger-v0.1.txt'; then
            echo 'run_functional_stream_holdout=true' >> "$GITHUB_OUTPUT"
          else
            echo 'run_functional_stream_holdout=false' >> "$GITHUB_OUTPUT"
          fi
          if printf '%s\n' "$changed" | grep -qx 'stage5/selfhost/parser-holdout-trigger-v0.1.txt'; then
            echo 'run_parser_holdout=true' >> "$GITHUB_OUTPUT"
          else
            echo 'run_parser_holdout=false' >> "$GITHUB_OUTPUT"
          fi
          if printf '%s\n' "$changed" | grep -qx 'stage5/selfhost/full-codec-holdout-trigger-v0.1.txt'; then
            echo 'run_full_codec_holdout=true' >> "$GITHUB_OUTPUT"
          else
            echo 'run_full_codec_holdout=false' >> "$GITHUB_OUTPUT"
          fi

  functional-stream-v0-2-holdout:
    needs: trigger
    if: needs.trigger.outputs.run_functional_stream_holdout == 'true'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-go@v5
        with:
          go-version: '1.23.x'

      - name: Validate frozen experiment protocol
        run: python stage5/selfhost/validate_experiment_protocol.py

      - name: Execute preregistered functional-stream v0.2 holdout
        run: python stage5/selfhost/verify_functional_stream_holdout_v0_1.py

  stream-parser-v0-1-holdout:
    needs: trigger
    if: needs.trigger.outputs.run_parser_holdout == 'true'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-go@v5
        with:
          go-version: '1.23.x'

      - name: Validate frozen experiment protocol
        run: python stage5/selfhost/validate_experiment_protocol.py

      - name: Validate preregistered parser contract/workloads
        run: python stage5/selfhost/validate_parser_contract.py

      - name: Execute preregistered stream-parser v0.1 holdout
        run: python stage5/selfhost/verify_stream_parser_holdout.py

  full-codec-v0-1-holdout:
    needs: trigger
    if: needs.trigger.outputs.run_full_codec_holdout == 'true'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-go@v5
        with:
          go-version: '1.23.x'

      - name: Validate frozen experiment protocol
        run: python stage5/selfhost/validate_experiment_protocol.py

      - name: Validate preregistered full-codec contract/workloads
        run: python stage5/selfhost/validate_full_codec_contract.py

      - name: Execute preregistered full-codec v0.1 holdout
        run: python stage5/selfhost/verify_full_codec_holdout.py
