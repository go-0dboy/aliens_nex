name: stage5-full-codec-static

on:
  pull_request:
    paths:
      - 'stage5/selfhost/build_full_codec.py'
      - 'stage5/selfhost/full-codec-v0.1.json'
      - 'stage5/selfhost/verify_full_codec_static.py'
      - 'stage5/selfhost/full-codec-contract-v0.1.json'
      - 'stage5/selfhost/full-codec-development-v0.1.json'
      - 'stage5/selfhost/full-codec-holdout-v0.1.json'
      - 'stage5/selfhost/build_full_codec_v0_2.py'
      - 'stage5/selfhost/full-codec-v0.2.json'
      - 'stage5/selfhost/verify_full_codec_static_v0_2.py'
      - 'stage5/selfhost/validate_full_codec_contract_v0_2.py'
      - 'stage5/selfhost/full-codec-contract-v0.2.json'
      - 'stage5/selfhost/full-codec-development-v0.2.json'
      - 'stage5/selfhost/full-codec-holdout-v0.2.json'
      - '.github/workflows/stage5-full-codec-static.yml'

permissions:
  contents: read

jobs:
  emit-identity:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-go@v5
        with:
          go-version: '1.23.x'
      - name: Preserve historical v0.1 preregistration and identity
        run: |
          python stage5/selfhost/validate_full_codec_contract.py
          python stage5/selfhost/build_full_codec.py --check
      - name: Validate preregistered v0.2 contract before candidate execution
        run: python stage5/selfhost/validate_full_codec_contract_v0_2.py
      - name: Preserve frozen v0.2 candidate identity
        run: python stage5/selfhost/build_full_codec_v0_2.py --check
      - name: Verify v0.2 canonical wire and Python/Go principal typing without semantic execution
        run: python stage5/selfhost/verify_full_codec_static_v0_2.py
