name: stage5-self-sufficiency

on:
  pull_request:
    paths:
      - 'stage5/selfhost/**'
      - 'reference/go/cmd/nexselfhostprobe/**'
      - 'reference/go/cmd/nexucontrol/**'
      - 'docs/STAGE-5-EXTENSION.md'
      - 'docs/experiments/stage5-selfhost-*.md'
      - 'docs/STATUS.md'
      - 'docs/RESEARCH-DISSERTATION.md'
      - 'docs/RESEARCH-DISSERTATION.ru.md'
      - 'docs/adr/0018-pre-stage6-core-self-sufficiency-gate.md'
      - 'docs/adr/README.md'
      - '.github/workflows/stage5-self-sufficiency.yml'
  push:
    branches: [ main ]
    paths:
      - 'stage5/selfhost/**'
      - 'reference/go/cmd/nexselfhostprobe/**'
      - 'reference/go/cmd/nexucontrol/**'
      - 'docs/STAGE-5-EXTENSION.md'
      - 'docs/experiments/stage5-selfhost-*.md'
      - 'docs/STATUS.md'
      - 'docs/RESEARCH-DISSERTATION.md'
      - 'docs/RESEARCH-DISSERTATION.ru.md'
      - 'docs/adr/0018-pre-stage6-core-self-sufficiency-gate.md'
      - 'docs/adr/README.md'
      - '.github/workflows/stage5-self-sufficiency.yml'

permissions:
  contents: read

jobs:
  selfhost-contract:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Compile self-host validators/builders
        run: |
          python -m py_compile stage5/selfhost/validate_meta_representation.py
          python -m py_compile stage5/selfhost/build_foundation.py
          python -m py_compile stage5/selfhost/verify_foundation.py
          python -m py_compile stage5/selfhost/build_meta_sequence.py
          python -m py_compile stage5/selfhost/python_need.py
          python -m py_compile stage5/selfhost/verify_meta_sequence.py
          python -m py_compile stage5/selfhost/build_integer_codec.py
          python -m py_compile stage5/selfhost/verify_integer_codec.py

      - name: Validate Stage 5.11 meta-representation
        run: python stage5/selfhost/validate_meta_representation.py

      - name: Check Stage 5.12 foundation reproducibility
        run: python stage5/selfhost/build_foundation.py --check

      - name: Check Stage 5.12b meta-sequence reproducibility
        run: python stage5/selfhost/build_meta_sequence.py --check

      - name: Check Stage 5.12c integer codec reproducibility
        run: python stage5/selfhost/build_integer_codec.py --check

      - name: Preserve corrected receiver-assumption model
        run: python stage5/validate_receiver_assumptions.py

      - name: Preserve frozen Stage 5 packet
        run: python stage5/build_packet.py --verify

      - name: Preserve frozen Stage 5 independent checkpoint
        run: python stage5/verify_independent_checkpoint.py

      - name: Preserve negative bootstrap result
        run: python stage5/bootstrap/validate_attempt.py

      - name: Keep Stage 6 planning artifact valid while inactive
        run: python stage6/validate_plan.py

  implementation-regression:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-go@v5
        with:
          go-version: '1.23.x'

      - name: Materialize frozen packet for independent verifier
        run: python stage5/build_packet.py --output independent/python/packet

      - name: Verify Stage 5.12 foundation across Python and Go
        run: python stage5/selfhost/verify_foundation.py

      - name: Measure Stage 5.12b meta-sequence across CBN and call-by-need
        run: python stage5/selfhost/verify_meta_sequence.py --report /tmp/meta-sequence-measurements.json

      - name: Upload Stage 5.12b measurement artifact
        uses: actions/upload-artifact@v4
        with:
          name: stage5-selfhost-meta-sequence-measurements
          path: /tmp/meta-sequence-measurements.json
          if-no-files-found: error

      - name: Verify Stage 5.12c NEX integer codec
        run: |
          python - <<'PY'
          import runpy
          import sys
          # The Python need control declares max_depth=2000. Keep the host
          # interpreter stack from becoming an accidental stricter limit.
          sys.setrecursionlimit(20000)
          runpy.run_path('stage5/selfhost/verify_integer_codec.py', run_name='__main__')
          PY

      - name: Verify independent Python implementation
        working-directory: independent/python
        run: python verify.py

      - name: Verify Go reference and frozen Stage 4 evidence
        working-directory: reference/go
        run: sh verify.sh
