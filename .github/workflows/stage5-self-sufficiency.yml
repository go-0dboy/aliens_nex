name: stage5-self-sufficiency

on:
  pull_request:
    paths:
      - 'stage5/selfhost/**'
      - 'docs/STAGE-5-EXTENSION.md'
      - 'docs/STAGE-5.12-CLOSEOUT.md'
      - 'docs/experiments/stage5-selfhost-*.md'
      - 'docs/STATUS.md'
      - 'docs/RESEARCH-DISSERTATION.md'
      - 'docs/RESEARCH-DISSERTATION.ru.md'
      - '.github/workflows/stage5-self-sufficiency.yml'
  push:
    branches: [ main ]
    paths:
      - 'stage5/selfhost/**'
      - 'docs/STAGE-5-EXTENSION.md'
      - 'docs/STAGE-5.12-CLOSEOUT.md'
      - 'docs/experiments/stage5-selfhost-*.md'
      - 'docs/STATUS.md'
      - 'docs/RESEARCH-DISSERTATION.md'
      - 'docs/RESEARCH-DISSERTATION.ru.md'
      - '.github/workflows/stage5-self-sufficiency.yml'

permissions:
  contents: read

jobs:
  active-invariants:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Compile active Stage 5.12 v0.2 tooling
        run: |
          python -m py_compile stage5/selfhost/validate_meta_representation_v0_3.py
          python -m py_compile stage5/selfhost/validate_experiment_protocol.py
          python -m py_compile stage5/selfhost/validate_full_codec_contract_v0_2.py
          python -m py_compile stage5/selfhost/build_full_codec_v0_2.py
          python -m py_compile stage5/selfhost/verify_full_codec_static_v0_2.py
          python -m py_compile stage5/selfhost/verify_full_codec_development_v0_2.py
          python -m py_compile stage5/selfhost/verify_full_codec_exhaustive_v0_2.py
      - name: Validate accepted Stage 5.11 representation
        run: python stage5/selfhost/validate_meta_representation_v0_3.py
      - name: Validate frozen anti-tuning protocol
        run: python stage5/selfhost/validate_experiment_protocol.py
      - name: Validate active Stage 5.12 v0.2 preregistration
        run: python stage5/selfhost/validate_full_codec_contract_v0_2.py
      - name: Preserve frozen Stage 5.12 v0.2 identity
        run: python stage5/selfhost/build_full_codec_v0_2.py --check
