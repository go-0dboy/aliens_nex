name: stage5-self-sufficiency

on:
  pull_request:
    paths:
      - 'stage5/selfhost/**'
      - 'docs/STAGE-5-EXTENSION.md'
      - 'docs/experiments/stage5-selfhost-*.md'
      - 'docs/STATUS.md'
      - 'docs/RESEARCH-DISSERTATION.md'
      - 'docs/RESEARCH-DISSERTATION.ru.md'
      - 'docs/adr/0018-pre-stage6-core-self-sufficiency-gate.md'
      - 'docs/adr/README.md'
      - '.github/workflows/stage5-self-sufficiency.yml'
  push:
    branches: [ main ]
    paths:
      - 'stage5/selfhost/**'
      - 'docs/STAGE-5-EXTENSION.md'
      - 'docs/experiments/stage5-selfhost-*.md'
      - 'docs/STATUS.md'
      - 'docs/RESEARCH-DISSERTATION.md'
      - 'docs/RESEARCH-DISSERTATION.ru.md'
      - 'docs/adr/0018-pre-stage6-core-self-sufficiency-gate.md'
      - 'docs/adr/README.md'
      - '.github/workflows/stage5-self-sufficiency.yml'

permissions:
  contents: read

jobs:
  selfhost-contract:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Compile self-host validators/builders
        run: |
          python -m py_compile stage5/selfhost/validate_meta_representation.py
          python -m py_compile stage5/selfhost/build_foundation.py
          python -m py_compile stage5/selfhost/verify_foundation.py

      - name: Validate Stage 5.11 meta-representation
        run: python stage5/selfhost/validate_meta_representation.py

      - name: Check Stage 5.12 foundation reproducibility
        run: python stage5/selfhost/build_foundation.py --check

      - name: Preserve corrected receiver-assumption model
        run: python stage5/validate_receiver_assumptions.py

      - name: Preserve frozen Stage 5 packet
        run: python stage5/build_packet.py --verify

      - name: Preserve frozen Stage 5 independent checkpoint
        run: python stage5/verify_independent_checkpoint.py

      - name: Preserve negative bootstrap result
        run: python stage5/bootstrap/validate_attempt.py

      - name: Keep Stage 6 planning artifact valid while inactive
        run: python stage6/validate_plan.py

  implementation-regression:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-go@v5
        with:
          go-version: '1.23.x'

      - name: Materialize frozen packet for independent verifier
        run: python stage5/build_packet.py --output independent/python/packet

      - name: Verify Stage 5.12 foundation across Python and Go
        run: python stage5/selfhost/verify_foundation.py

      - name: Verify independent Python implementation
        working-directory: independent/python
        run: python verify.py

      - name: Verify Go reference and frozen Stage 4 evidence
        working-directory: reference/go
        run: sh verify.sh
